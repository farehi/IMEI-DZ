{% extends "base.html" %}
{% block title %}طلب حذف بلاغ{% endblock %}

{% block content %}
<div class="text-center mb-3">
    <h1 class="page-title">طلب حذف بلاغ</h1>
    <p class="page-subtitle">إذا استرجعت هاتفك أو تريد حذف بلاغ، املأ النموذج وأرفق الإثباتات.</p>
</div>

<div class="card card-custom p-3">
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label required">الاسم الكامل</label>
            <input type="text" name="full_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label required">البريد أو رقم الهاتف</label>
            <input type="text" name="contact" class="form-control" placeholder="05XXXXXXXX أو email@mail.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label required">IMEI أو S/N أو الرقم المرجعي</label>
            <input type="text" name="imei_or_sn" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label required">سبب طلب الحذف</label>
            <textarea name="reason" class="form-control" rows="3" required></textarea>
        </div>

        <h6 class="fw-bold mb-2"><i class="bi bi-paperclip me-1"></i> الإثباتات</h6>
        <div class="mb-3">
            <label class="form-label required">1. صورة علبة / وصل شراء</label>
            <input type="file" name="proof_file1" class="form-control" accept=".jpg,.jpeg,.png,.pdf,.webp" required>
        </div>
        <div class="mb-3">
            <label class="form-label required">2. لقطة *#06#</label>
            <input type="file" name="proof_file2" class="form-control" accept=".jpg,.jpeg,.png,.pdf,.webp" required>
        </div>
        <div class="mb-3">
            <label class="form-label">ملفات إضافية (اختياري)</label>
            <input type="file" name="extra_files" class="form-control" accept=".jpg,.jpeg,.png,.pdf,.webp" multiple>
        </div>

        <div class="mb-4">
            <label class="form-label required">تحقق بشري: {{ captcha_q }}</label>
            <input type="hidden" name="captcha_token" value="{{ captcha_token }}">
            <input type="number" name="captcha_answer" class="form-control" placeholder="أدخل الناتج" required>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100">
            <i class="bi bi-send me-1"></i> إرسال طلب الحذف
        </button>
    </form>
</div>
{% endblock %}
